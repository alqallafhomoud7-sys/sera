<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Rush</title>
<style>
body{font:16px Arial,sans-serif;background:#151c1d;color:#f4f4ed;max-width:700px;margin:60px auto;padding:20px}
h1{color:#d4fa67}input,button{font:inherit;padding:12px;border:0;border-radius:8px}
input{width:60%;background:#263132;color:white}button{background:#d4fa67;cursor:pointer}
li{padding:12px;border-bottom:1px solid #394344;font-size:20px}
small{color:#aab5b2}
</style>
<h1>Word Rush</h1>
<p>Enter a word. Play it again to help it climb the leaderboard!</p>
<form id="form"><input id="word" placeholder="Type a word" maxlength="24" required><button>Play word</button></form>
<h2>Leaderboard</h2>
<ol id="board"></ol>
<script>
let scores=JSON.parse(localStorage.getItem("word-rush")||"{}");
function show(){
 const list=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 document.querySelector("#board").innerHTML=list.length
  ?list.map(([w,n])=>`<li>${w} <small>— ${n} ${n===1?"vote":"votes"}</small></li>`).join("")
  :"<p>Be the first to play a word!</p>";
}
document.querySelector("#form").onsubmit=e=>{
 e.preventDefault();
 const w=document.querySelector("#word").value.trim().toLowerCase();
 if(!w)return;
 scores[w]=(scores[w]||0)+1;
 localStorage.setItem("word-rush",JSON.stringify(scores));
 document.querySelector("#word").value="";
 show();
};
show();
</script>
</html>
